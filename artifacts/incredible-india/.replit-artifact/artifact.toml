kind = "web"
previewPath = "/"
title = "Incredible India"
version = "1.0.0"
id = "artifacts/incredible-india"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26081

[services.development]
run = "pnpm --filter @workspace/incredible-india run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/incredible-india", "run", "build" ]
publicDir = "artifacts/incredible-india/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26081"
BASE_PATH = "/"
